  <script>
    const fmt = v => Math.round(v).toLocaleString('ko-KR') + '원';

    function syncRange(numId, rangeId, min, max) {
      const r = document.getElementById(rangeId);
      const n = document.getElementById(numId);
      if (numId === 'loanAmt') {
        n.value = Number(r.value).toLocaleString('ko-KR');
        updateKoreanAmount(Number(r.value));
      } else {
        n.value = r.value;
      }
      updateRangeColor(r, min, max);
      if (numId === 'term') updateTermYear();
    }

    function numberToKorean(num) {
      if (num === 0) return '0';
      const units = ['', '만', '억', '조'];
      let result = '';
      let i = 0;

      while (num > 0) {
        let chunk = num % 10000;
        if (chunk > 0) {
          result = chunk + units[i] + (result ? ' ' : '') + result;
        }
        num = Math.floor(num / 10000);
        i++;
      }
      return result + '원';
    }

    function updateKoreanAmount(num) {
      const korEl = document.getElementById('loanAmtKo');
      if (korEl) korEl.textContent = numberToKorean(num);
    }

    function updateRangeColor(el, min, max) {
      const pct = ((el.value - min) / (max - min)) * 100;
      el.style.setProperty('--pct', pct + '%');
    }

    function updateTermYear() {
      const m = parseInt(document.getElementById('term').value) || 0;
      const el = document.getElementById('termYear');
      if (m >= 12) el.textContent = `(${Math.floor(m / 12)}년 ${m % 12}개월)`;
      else el.textContent = '';
    }

    // 대출금액 콤마 처리 이벤트
    document.getElementById('loanAmt').addEventListener('input', function () {
      // 숫자만 남기기
      let value = this.value.replace(/[^0-9]/g, '');
      if (!value) value = '0';

      // 제한 (10억 최대)
      let num = parseInt(value, 10);
      if (num > 1000000000) num = 1000000000;

      // 포맷팅해서 입력창 갱신
      this.value = num.toLocaleString('ko-KR');

      // 한글 금액 표기 갱신
      updateKoreanAmount(num);

      // 슬라이더 동기화
      const r = document.getElementById('loanRange');
      r.value = num;
      updateRangeColor(r, 1000000, 1000000000);
    });

    // 이자율, 기간 숫자 입력 → 슬라이더 동기화
    ['rate', 'term'].forEach(id => {
      document.getElementById(id).addEventListener('input', function () {
        const rId = id + 'Range';
        const r = document.getElementById(rId);
        r.value = this.value;
        const ranges = { rate: [0.1, 30], term: [1, 480] };
        updateRangeColor(r, ...ranges[id]);
        if (id === 'term') updateTermYear();
      });
    });


    // 초기 슬라이더 색상
    updateRangeColor(document.getElementById('loanRange'), 1000000, 1000000000);
    updateRangeColor(document.getElementById('rateRange'), 0.1, 30);
    updateRangeColor(document.getElementById('termRange'), 1, 480);
    updateTermYear();

    function calculate() {
      const P = parseFloat(document.getElementById('loanAmt').value);
      const annualRate = parseFloat(document.getElementById('rate').value);
      const n = parseInt(document.getElementById('term').value);
      const method = document.querySelector('input[name="repay"]:checked').value;

      if (!P || !annualRate || !n) return;

      const r = annualRate / 100 / 12;
      let schedule = [];

      if (method === 'equal') {
        // 원리금균등
        const M = P * r * Math.pow(1 + r, n) / (Math.pow(1 + r, n) - 1);
        let bal = P;
        for (let i = 1; i <= n; i++) {
          const intPart = bal * r;
          const prinPart = M - intPart;
          bal -= prinPart;
          schedule.push({ month: i, payment: M, principal: prinPart, interest: intPart, balance: Math.max(0, bal) });
        }
      } else if (method === 'principal') {
        // 원금균등
        const prinPart = P / n;
        let bal = P;
        for (let i = 1; i <= n; i++) {
          const intPart = bal * r;
          const payment = prinPart + intPart;
          bal -= prinPart;
          schedule.push({ month: i, payment, principal: prinPart, interest: intPart, balance: Math.max(0, bal) });
        }
      } else {
        // 만기일시
        const monthlyInt = P * r;
        for (let i = 1; i <= n; i++) {
          const payment = i < n ? monthlyInt : P + monthlyInt;
          const prinPart = i < n ? 0 : P;
          schedule.push({ month: i, payment, principal: prinPart, interest: monthlyInt, balance: i < n ? P : 0 });
        }
      }

      const totalPayment = schedule.reduce((a, b) => a + b.payment, 0);
      const totalInterest = totalPayment - P;

      // 요약
      document.getElementById('r-monthly').textContent = fmt(schedule[0].payment);
      document.getElementById('r-total').textContent = fmt(totalPayment);
      document.getElementById('r-interest').textContent = fmt(totalInterest);

      // 파이차트
      const pct = (P / totalPayment) * 100;
      const interestPct = 100 - pct;
      const circ = 2 * Math.PI * 15.9;
      const mainLen = (pct / 100) * 100;
      document.getElementById('pie-main').setAttribute('stroke-dasharray', `${mainLen} ${100 - mainLen}`);
      document.getElementById('leg-principal').textContent = `원금: ${fmt(P)}`;
      document.getElementById('leg-interest').textContent = `이자: ${fmt(totalInterest)}`;
      document.getElementById('leg-ratio').textContent = `원금 ${pct.toFixed(1)}% / 이자 ${interestPct.toFixed(1)}%`;

      // 스케줄 테이블
      const tbody = document.getElementById('scheduleBody');
      tbody.innerHTML = schedule.map(s => `
    <tr>
      <td>${s.month}회</td>
      <td>${fmt(s.payment)}</td>
      <td>${fmt(s.principal)}</td>
      <td>${fmt(s.interest)}</td>
      <td>${fmt(s.balance)}</td>
    </tr>
  `).join('');

      const card = document.getElementById('resultCard');
      card.classList.remove('show');
      void card.offsetWidth;
      card.classList.add('show');
    }

    function toggleSchedule() {
      const wrap = document.getElementById('scheduleWrap');
      const btn = document.getElementById('scheduleToggle');
      const open = wrap.style.display === 'none';
      wrap.style.display = open ? 'block' : 'none';
      btn.classList.toggle('open', open);
      btn.childNodes[1].textContent = open ? ' 월별 상환 스케줄 접기' : ' 월별 상환 스케줄 보기';
    }
  </script>
</body>
